<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="oibBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#141f36"/>
    </linearGradient>
    <linearGradient id="oibCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1524" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="oibBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="oibGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#oibBg)"/>
  <circle cx="200" cy="140" r="140" fill="#3b82f6" opacity="0.12" filter="url(#oibGlow)"/>
  <circle cx="620" cy="340" r="160" fill="#06b6d4" opacity="0.12" filter="url(#oibGlow)"/>

  <!-- Top App Window Bar -->
  <rect x="50" y="30" width="700" height="42" rx="12" fill="#111c2e" stroke="#233552" stroke-width="1.2"/>
  <circle cx="76" cy="51" r="5" fill="#ef4444"/>
  <circle cx="94" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="112" cy="51" r="5" fill="#10b981"/>
  <text x="310" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Temperature Converter — OIBSIP</text>

  <!-- Central Card -->
  <g transform="translate(160, 96)">
    <rect x="0" y="0" width="480" height="344" rx="22" fill="url(#oibCard)" stroke="#283d5e" stroke-width="1.5"/>

    <circle cx="240" cy="46" r="22" fill="#3b82f6" opacity="0.15"/>
    <path d="M240 34 v16 m-4 -8 h8" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <text x="240" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Temperature Converter</text>
    <text x="240" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Convert Celsius, Fahrenheit, and Kelvin seamlessly</text>

    <!-- Degrees Input Box -->
    <text x="40" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">DEGREES</text>
    <rect x="40" y="156" width="220" height="46" rx="10" fill="#0a101a" stroke="#2d4469" stroke-width="1.2"/>
    <text x="56" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">25.0</text>
    <text x="236" y="184" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">°C</text>

    <!-- Type Selection Box -->
    <text x="280" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">INPUT UNIT</text>
    <rect x="280" y="156" width="160" height="46" rx="10" fill="#0a101a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="296" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">Celsius (°C)</text>
    <path d="M418 176 l4 4 l4 -4" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Convert Button -->
    <rect x="40" y="222" width="400" height="44" rx="12" fill="url(#oibBtn)"/>
    <text x="240" y="249" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Convert Temperature</text>

    <!-- Converted Output Box -->
    <rect x="40" y="280" width="400" height="46" rx="12" fill="#08101d" stroke="#1d2e47" stroke-width="1.2"/>
    <text x="56" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Result:</text>
    <text x="110" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">77.0 °F</text>
    <text x="180" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">•</text>
    <text x="196" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#38bdf8">298.15 K</text>
  </g>
</svg>